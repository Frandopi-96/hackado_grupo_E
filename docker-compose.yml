# Prototipo 480 Academy: nginx + backend FastAPI + PostgreSQL.
# Arranque: cp .env.example .env && docker compose up -d --build
# Abrir: http://localhost:8080 (desde el móvil, http://IP-del-portátil:8080)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Sin "ports": la base de datos solo es accesible desde la red interna.

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    volumes:
      # Los tests se ejecutan dentro del contenedor (ver AGENTS.md, comandos)
      - ./tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Sin "ports": solo se llega al backend a través de nginx (/api/).

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
