<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>480 Academy</title>
  <!-- Página provisional para comprobar el despliegue. La sustituye el frontend real (HU3, HU6...). -->
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
           padding: 24px; box-sizing: border-box; background: #1F2222; color: #FFFFFF;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #D0D5D2; font-size: 16px; line-height: 1.5; }
    .ok { color: #39FE90; } .error { color: #FF4950; }
  </style>
</head>
<body>
  <h1>480 Academy</h1>
  <p>Prototipo en construcción.</p>
  <p>Backend y base de datos: <strong id="estado">comprobando…</strong></p>
  <script>
    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        const e = document.getElementById('estado');
        e.textContent = d.status === 'ok' ? 'conectados' : 'sin conexión';
        e.className = d.status === 'ok' ? 'ok' : 'error';
      })
      .catch(() => {
        const e = document.getElementById('estado');
        e.textContent = 'sin conexión';
        e.className = 'error';
      });
  </script>
</body>
</html>
