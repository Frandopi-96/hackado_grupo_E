<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    /* Colores y tipografía de docs/DESIGN.md */
    @theme {
      --color-marca-oscuro: #1F2222;
      --color-marca-verde: #39FE90;
      --color-marca-cian: #1CF9FC;
      --color-marca-rojo: #FF4950;
      --color-gris-claro: #D0D5D2;
      --color-superficie: #2A2E2E;
      --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="/js/api.js"></script>
  <title>Cuéntanos sobre ti · 480 Academy</title>
</head>
<body class="bg-marca-oscuro text-white font-sans min-h-dvh">
  <!-- HU1: formulario inicial. Una pregunta por pantalla y botones grandes abajo para usarlo con una mano. -->
  <main class="max-w-md mx-auto min-h-dvh flex flex-col px-6 py-8" x-data="formulario()">
    <p class="text-sm font-medium text-marca-cian" x-text="`Pregunta ${paso + 1} de ${preguntas.length}`"></p>
    <div class="h-1 bg-superficie rounded mt-2">
      <div class="h-1 bg-marca-verde rounded transition-all" :style="`width: ${(paso + 1) / preguntas.length * 100}%`"></div>
    </div>

    <template x-for="(p, i) in preguntas" :key="p.campo">
      <section x-show="paso === i" class="flex flex-col flex-1 mt-8">
        <h1 class="text-[22px] font-bold leading-snug" x-text="p.titulo"></h1>
        <p x-show="p.multiple" class="text-gris-claro mt-1">Puedes elegir varias.</p>
        <div class="flex flex-col gap-3 mt-6">
          <template x-for="o in p.opciones" :key="String(o.valor)">
            <button type="button" @click="elegir(p, o.valor)"
                    class="min-h-14 px-4 rounded text-left text-base border transition-colors"
                    :class="marcada(p, o.valor) ? 'bg-marca-verde text-marca-oscuro border-marca-verde font-medium' : 'bg-superficie border-gris-claro/30'"
                    :aria-pressed="marcada(p, o.valor)" x-text="o.texto"></button>
          </template>
        </div>
      </section>
    </template>

    <p x-show="error" x-text="error" role="alert" class="text-marca-rojo mt-4"></p>

    <div class="flex gap-3 pt-6 mt-auto">
      <button type="button" x-show="paso > 0" @click="paso--"
              class="h-14 px-5 rounded border border-gris-claro/30 text-gris-claro">Atrás</button>
      <button type="button" @click="siguiente" :disabled="!respondida(preguntas[paso]) || enviando"
              class="h-14 flex-1 rounded bg-marca-verde text-marca-oscuro font-bold text-lg disabled:opacity-40"
              x-text="paso < preguntas.length - 1 ? 'Siguiente' : (enviando ? 'Guardando…' : 'Ver mi itinerario')"></button>
    </div>
  </main>
  <script>
    function formulario() {
      return {
        paso: 0,
        error: "",
        enviando: false,
        r: { nivel: null, intereses: [], objetivo: null, disponibilidad_min: null, por_empresa: null },
        preguntas: [
          { campo: "nivel", titulo: "¿Cuánto has programado antes?", opciones: [
            { valor: "nunca", texto: "Nunca he programado" },
            { valor: "algo", texto: "He programado algo" },
            { valor: "otro_lenguaje", texto: "Ya programo en otro lenguaje" } ] },
          { campo: "intereses", multiple: true, titulo: "¿Qué te gustaría hacer con Python?", opciones: [
            { valor: "datos", texto: "Analizar datos" },
            { valor: "web", texto: "Desarrollo web" },
            { valor: "automatizar", texto: "Automatizar tareas" },
            { valor: "ia", texto: "Inteligencia artificial" } ] },
          { campo: "objetivo", titulo: "¿Cuál es tu objetivo principal?", opciones: [
            { valor: "empleo", texto: "Encontrar trabajo" },
            { valor: "mejorar_trabajo", texto: "Mejorar en mi trabajo actual" },
            { valor: "curiosidad", texto: "Aprender por curiosidad" } ] },
          { campo: "disponibilidad_min", titulo: "¿Cuánto tiempo puedes dedicarle al día?", opciones: [
            { valor: 15, texto: "15 minutos" },
            { valor: 30, texto: "30 minutos" },
            { valor: 60, texto: "1 hora" } ] },
          { campo: "por_empresa", titulo: "¿Haces el curso a través de tu empresa?", opciones: [
            { valor: true, texto: "Sí, me lo ofrece mi empresa" },
            { valor: false, texto: "No, por mi cuenta" } ] },
        ],
        marcada(p, v) {
          return p.multiple ? this.r[p.campo].includes(v) : this.r[p.campo] === v;
        },
        respondida(p) {
          return p.multiple ? this.r[p.campo].length > 0 : this.r[p.campo] !== null;
        },
        elegir(p, v) {
          if (!p.multiple) { this.r[p.campo] = v; return; }
          const lista = this.r[p.campo];
          this.r[p.campo] = lista.includes(v) ? lista.filter(x => x !== v) : [...lista, v];
        },
        async siguiente() {
          if (this.paso < this.preguntas.length - 1) { this.paso++; return; }
          this.error = "";
          this.enviando = true;
          const r = await api("/perfil", { metodo: "POST", datos: this.r });
          this.enviando = false;
          if (r.ok) location.href = "/itinerario.html";
          else if (r.status === 401) location.href = "/login.html";
          else this.error = r.error;
        },
      };
    }
  </script>
</body>
</html>
