server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: todo lo que empieza por /api/ va al backend FastAPI
    location /api/ {
        # DNS interno de Docker: nginx busca "backend" en cada petición,
        # así no se cae al arrancar si el backend aún no está listo.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (PWA): ficheros estáticos de la carpeta frontend/
    location / {
        try_files $uri $uri/ /index.html;
    }
}
